<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI Assistant</title>
<style>
body {
  background: #050b16;
  color: #00eaff;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 25px;
}
h1 {
  margin-top: 50px;
  text-shadow: 0 0 15px #00eaff;
}
.circle {
  width: 180px;
  height: 180px;
  border: 3px solid #00eaff;
  border-radius: 50%;
  margin: 35px auto;
  box-shadow: 0 0 30px #00eaff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
}
input {
  padding: 14px;
  width: 65%;
  border-radius: 10px;
  border: 1px solid #00eaff;
  background: #101a2b;
  color: white;
}
button {
  padding: 14px;
  margin: 8px;
  border: none;
  border-radius: 10px;
  background: #00cfff;
  color: #00111b;
  font-weight: bold;
}
</style>
</head>
<body>

<h1>J.A.R.V.I.S</h1>
<p>PERSONAL AI ASSISTANT</p>

<div class="circle">JARVIS</div>

<p id="reply">Hello Sir! How can I help you?</p>

<input id="question" placeholder="Ask me something...">
<button onclick="askJarvis()">Ask</button>
<button onclick="speak()">Speak</button>

<script>
function askJarvis() {
  let q = document.getElementById("question").value;
  let answer = "Hello Sir! You asked: " + q;
  document.getElementById("reply").innerText = answer;
  speakText(answer);
}

function speakText(text) {
  let msg = new SpeechSynthesisUtterance(text);
  speechSynthesis.speak(msg);
}

function speak() {
  let recognition = window.SpeechRecognition ||
                    window.webkitSpeechRecognition;

  if (!recognition) {
    alert("Voice recognition is not supported in this browser.");
    return;
  }

  let r = new recognition();
  r.lang = "en-IN";
  r.onresult = function(event) {
    document.getElementById("question").value =
      event.results[0][0].transcript;
    askJarvis();
  };
  r.start();
}
</script>

</body>
</html>
